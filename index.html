<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Offline Encrypted .WILMAP Field Navigator V3.2 - Secure Edition</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    body { background-color: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; width: 100vw; display: flex; flex-direction: column; overflow: hidden; }
    
    header { background-color: #1e293b; border-bottom: 1px solid #334155; padding: 12px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; z-index: 20; flex-shrink: 0; }
    .status-group { display: flex; align-items: center; gap: 8px; }
    .status-title { font-weight: bold; color: #34d399; font-size: 13px; }
    .status-gps { font-size: 10px; color: #94a3b8; font-family: monospace; }
    .gps-active { color: #34d399; font-weight: bold; }

    .toolbar { display: flex; align-items: center; gap: 4px; background-color: #0f172a; padding: 4px; border-radius: 8px; border: 1px solid #334155; overflow-x: auto; }
    .btn { padding: 5px 10px; font-size: 12px; border-radius: 4px; font-weight: 600; border: none; cursor: pointer; white-space: nowrap; color: #cbd5e1; background: transparent; }
    .btn:hover { background-color: #1e293b; }
    .btn-active { background-color: #059669; color: #ffffff; }
    .btn-blue { background-color: #2563eb; color: #ffffff; }
    .btn-red-subtle { background-color: rgba(127, 29, 29, 0.4); color: #fca5a5; border: 1px solid #991b1b; }
    .btn-file { background-color: #059669; color: #ffffff; padding: 6px 12px; border-radius: 8px; font-weight: 600; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 4px; }

    main { flex: 1; width: 100%; height: 100%; background-color: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
    canvas { width: 100%; height: 100%; cursor: grab; touch-action: none; }

    #pinCrosshair { pointer-events: none; position: absolute; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; }
    .crosshair-circle { width: 40px; height: 40px; border: 2px solid #ef4444; border-radius: 50%; background-color: rgba(239, 68, 68, 0.1); }
    .crosshair-center { position: absolute; width: 8px; height: 8px; background-color: #ef4444; border-radius: 50%; }
    .crosshair-h { position: absolute; width: 48px; height: 2px; background-color: rgba(239, 68, 68, 0.8); }
    .crosshair-v { position: absolute; height: 48px; width: 2px; background-color: rgba(239, 68, 68, 0.8); }

    #pinActionBar { position: absolute; top: 16px; z-index: 30; display: flex; gap: 8px; background-color: rgba(15, 23, 42, 0.95); border: 1px solid #334155; padding: 10px; border-radius: 12px; }
    .btn-confirm-pin { background-color: #dc2626; color: white; font-weight: bold; font-size: 12px; padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; }

    .modal { background-color: #1e293b; border: 1px solid #334155; padding: 24px; border-radius: 16px; max-width: 380px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); z-index: 40; position: absolute; width: calc(100% - 32px); }
    .modal-title { font-size: 16px; font-weight: bold; color: #f1f5f9; margin-bottom: 6px; }
    .modal-body { font-size: 12px; color: #94a3b8; margin-bottom: 16px; line-height: 1.4; }
    .input-field { background-color: #0f172a; border: 1px solid #334155; color: #f8fafc; font-size: 14px; border-radius: 8px; padding: 10px; text-align: center; width: 100%; margin-bottom: 12px; outline: none; }
    .modal-actions { display: flex; gap: 8px; justify-content: center; }
    .radio-option { display: flex; align-items: center; gap: 8px; background-color: #0f172a; padding: 10px; border-radius: 8px; border: 1px solid #334155; text-align: left; margin-bottom: 8px; font-size: 12px; cursor: pointer; }
    .hidden { display: none !important; }
  </style>
</head>
<body oncontextmenu="return false;">

  <header>
    <div class="status-group">
      <span style="font-size: 20px;">🔒</span>
      <div>
        <div class="status-title">PWA .WILMAP Navigator V3.2 (Secured)</div>
        <div id="gpsStatus" class="status-gps">GPS: Initializing...</div>
      </div>
    </div>

    <div id="toolBar" class="toolbar hidden">
      <button onclick="setMode('pan')" id="btnPan" class="btn btn-active">✋ Pan</button>
      <button onclick="setMode('pin')" id="btnPin" class="btn">📍 Pin Point</button>
      <button onclick="toggleTracking()" id="btnTrack" class="btn btn-blue">🛰️ Start Track</button>
      <button onclick="resetView()" class="btn">🎯 Reset</button>
      <button onclick="openExportModal()" class="btn" style="background-color: #047857; color: white;">💾 Export Data</button>
      <button onclick="clearGraphics()" class="btn btn-red-subtle">🗑️ Clear</button>
    </div>

    <label class="btn-file">
      <span>📂 Open .WILMAP</span>
      <input type="file" id="fileInput" accept=".wilmap,.zip" class="hidden" onchange="handleFileSelect(event)">
    </label>
  </header>

  <main>
    <canvas id="mapCanvas" class="hidden"></canvas>

    <div id="pinCrosshair" class="hidden">
      <div style="position: relative; display: flex; align-items: center; justify-content: center;">
        <div class="crosshair-circle"></div>
        <div class="crosshair-center"></div>
        <div class="crosshair-h"></div>
        <div class="crosshair-v"></div>
      </div>
    </div>

    <div id="pinActionBar" class="hidden">
      <button onclick="captureCenterPin()" class="btn-confirm-pin">📍 Confirm Location Pin</button>
      <button onclick="setMode('pan')" class="btn" style="background-color: #475569; color: white;">Cancel</button>
    </div>

    <div id="statusModal" class="modal">
      <div id="statusIcon" class="modal-icon" style="font-size: 32px; margin-bottom: 8px;">🗺️</div>
      <div id="statusTitle" class="modal-title">Load Secure Container</div>
      <div id="statusBody" class="modal-body">Select an obfuscated .wilmap container package to unlock offline navigation.</div>

      <div id="passcodeContainer" class="hidden">
        <input type="password" id="passcodeInput" placeholder="Enter Container Passcode" class="input-field" onkeydown="if(event.key === 'Enter') attemptDecryption()">
        <button onclick="attemptDecryption()" class="btn btn-file" style="width: 100%; justify-content: center; padding: 10px;">
          Unlock Container
        </button>
      </div>
    </div>

    <div id="expiryNoticeModal" class="modal hidden" style="z-index: 50;">
      <div style="font-size: 32px; margin-bottom: 8px;">⚠️</div>
      <div class="modal-title">Container Access Notice</div>
      <div id="expiryNoticeBody" class="modal-body" style="font-size: 13px;"></div>
      <div class="modal-actions">
        <button onclick="dismissExpiryNotice()" class="btn btn-file" style="width: 100%; justify-content: center; padding: 10px; background-color: #2563eb;">OK</button>
      </div>
    </div>

    <div id="pinModal" class="modal hidden">
      <div class="modal-title">Add Point Remark</div>
      <input type="text" id="pinRemarkInput" placeholder="Enter remark/notes..." class="input-field" onkeydown="if(event.key === 'Enter') confirmPin()">
      <div class="modal-actions">
        <button onclick="confirmPin()" class="btn btn-file">Save Pin</button>
        <button onclick="closePinModal()" class="btn" style="background-color: #475569; color: white;">Cancel</button>
      </div>
    </div>

    <div id="exportModal" class="modal hidden">
      <div class="modal-title">💾 Export Spatial Field Data</div>
      <div class="modal-body">Choose export format:</div>
      <div style="margin-bottom: 16px;">
        <label class="radio-option">
          <input type="radio" name="exportFormat" value="geojson" checked>
          <div><strong style="color: #34d399;">GeoJSON</strong></div>
        </label>
        <label class="radio-option">
          <input type="radio" name="exportFormat" value="kml">
          <div><strong style="color: #34d399;">KML</strong></div>
        </label>
        <label class="radio-option">
          <input type="radio" name="exportFormat" value="csv">
          <div><strong style="color: #34d399;">CSV (Comma Separated Values)</strong></div>
        </label>
      </div>
      <div class="modal-actions">
        <button onclick="executeExport()" class="btn btn-file">Save Local File</button>
        <button onclick="closeExportModal()" class="btn" style="background-color: #475569; color: white;">Cancel</button>
      </div>
    </div>
  </main>

  <script>
    // --- ANTI-THEFT & HARDENING INTERCEPTORS ---
    document.addEventListener('keydown', function (e) {
      if (
        e.keyCode === 123 || // F12
        (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || // Ctrl+Shift+I / J
        (e.ctrlKey && e.keyCode === 85) || // Ctrl+U (View Source)
        (e.ctrlKey && e.keyCode === 83) || // Ctrl+S (Save)
        (e.ctrlKey && e.keyCode === 80)    // Ctrl+P (Print)
      ) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }
    });

    const targetCanvasPrototype = HTMLCanvasElement.prototype;
    targetCanvasPrototype.toDataURL = function() {
      console.warn("Security policy violation: Image ripping blocked.");
      return "";
    };
    targetCanvasPrototype.toBlob = function(callback) {
      console.warn("Security policy violation: Blob ripping blocked.");
      if (typeof callback === 'function') callback(null);
    };
    window.addEventListener('beforeprint', (e) => {
      e.preventDefault();
      alert("Printing map layout images is disabled by security policy.");
    });

    let containerPayloadData = null;
    let baseImageBitmap = null;
    let currentGpsCoords = null;
    let mapBbox = null;
    let cachedExpiryReadable = "";
    let scale = 1, panX = 0, panY = 0, isDragging = false, dragStart = { x: 0, y: 0 };
    let activeMode = 'pan', pins = [], trackLogs = [], isTracking = false, pendingPinCoords = null;

    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const gpsStatus = document.getElementById('gpsStatus');

    function resizeCanvas() {
      if (!canvas) return;
      const displayW = canvas.parentElement.clientWidth;
      const displayH = canvas.parentElement.clientHeight;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = displayW * dpr;
      canvas.height = displayH * dpr;
      ctx.scale(dpr, dpr);
      renderMapAndGps();
    }
    window.addEventListener('resize', resizeCanvas);

    function startGpsTracking() {
      if (!('geolocation' in navigator)) return;
      navigator.geolocation.watchPosition(
        (pos) => {
          currentGpsCoords = { lon: pos.coords.longitude, lat: pos.coords.latitude };
          gpsStatus.innerText = `GPS Fix: ${currentGpsCoords.lat.toFixed(5)}, ${currentGpsCoords.lon.toFixed(5)}`;
          gpsStatus.className = "status-gps gps-active";
          if (isTracking && currentGpsCoords) {
            trackLogs.push({ lon: currentGpsCoords.lon, lat: currentGpsCoords.lat, timestamp: new Date().toISOString() });
          }
          renderMapAndGps();
        },
        () => { gpsStatus.innerText = `GPS Error: Signal or permission off`; },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
      );
    }
    window.addEventListener('DOMContentLoaded', () => { startGpsTracking(); resizeCanvas(); });

    async function handleFileSelect(event) {
      const fileInputEl = event.target;
      const file = fileInputEl.files[0];
      if (!file) return;
      
      try {
        const zip = new JSZip();
        const zipContent = await zip.loadAsync(file);
        
        let containerFile = zipContent.files["payload/container_data.json"] || 
                            zipContent.files["./payload/container_data.json"] ||
                            Object.keys(zipContent.files).find(k => k.endsWith("container_data.json"));
                            
        if (!containerFile) throw new Error("Invalid container structure: container_data.json missing.");
        
        containerPayloadData = JSON.parse(await containerFile.async("text"));
        showModal('🔑', 'Container Authentication', 'Enter security passcode to unlock container:', true);
      } catch (err) {
        showModal('⚠️', 'Invalid Container', err.message, false);
      } finally {
        fileInputEl.value = '';
      }
    }

    async function deriveKeyBytes(passcode, saltBase64, contextSeedBase64) {
      const enc = new TextEncoder();
      const salt = Uint8Array.from(atob(saltBase64), c => c.charCodeAt(0));
      const contextSeed = Uint8Array.from(atob(contextSeedBase64), c => c.charCodeAt(0));
      const passBytes = enc.encode(passcode);
      
      const combined = new Uint8Array(passBytes.length + contextSeed.length);
      combined.set(passBytes, 0);
      combined.set(contextSeed, passBytes.length);

      const keyMaterial = await crypto.subtle.importKey("raw", combined, "PBKDF2", false, ["deriveBits"]);
      const derivedBits = await crypto.subtle.deriveBits(
        { name: "PBKDF2", salt: salt, iterations: 200000, hash: "SHA-256" },
        keyMaterial,
        256
      );
      return new Uint8Array(derivedBits);
    }

    async function decryptContainerPayload(passcode, container) {
      const salt = container.p1;
      const contextSeed = container.p0;
      const nonce = Uint8Array.from(atob(container.p2), c => c.charCodeAt(0));
      const expectedMac = Uint8Array.from(atob(container.p3), c => c.charCodeAt(0));
      const ciphertext = Uint8Array.from(atob(container.p4), c => c.charCodeAt(0));
      
      const derivedKeyBytes = await deriveKeyBytes(passcode, salt, contextSeed);
      
      const cryptoKey = await crypto.subtle.importKey(
        "raw",
        derivedKeyBytes,
        { name: "HMAC", hash: "SHA-256" },
        false,
        ["verify"]
      );

      const isValidMac = await crypto.subtle.verify(
        "HMAC",
        cryptoKey,
        expectedMac,
        ciphertext
      );

      if (!isValidMac) {
        throw new Error("HMAC integrity verification failed: Container payload has been altered or tampered with.");
      }
      
      const extendedKey = new Uint8Array(ciphertext.length);
      let offset = 0;
      let counter = 0;
      while (offset < ciphertext.length) {
        const counterBytes = new Uint8Array([counter & 0xFF, (counter >> 8) & 0xFF]);
        const msgBlock = new Uint8Array(derivedKeyBytes.length + nonce.length + counterBytes.length);
        msgBlock.set(derivedKeyBytes, 0);
        msgBlock.set(nonce, derivedKeyBytes.length);
        msgBlock.set(counterBytes, derivedKeyBytes.length + nonce.length);
        
        const hashBuffer = await crypto.subtle.digest("SHA-256", msgBlock);
        const hashBytes = new Uint8Array(hashBuffer);
        
        const chunkLen = Math.min(hashBytes.length, ciphertext.length - offset);
        for (let i = 0; i < chunkLen; i++) {
          extendedKey[offset + i] = hashBytes[i];
        }
        offset += chunkLen;
        counter++;
      }

      const decryptedBytes = new Uint8Array(ciphertext.length);
      for (let i = 0; i < ciphertext.length; i++) {
        decryptedBytes[i] = ciphertext[i] ^ extendedKey[i];
      }

      return JSON.parse(new TextDecoder().decode(decryptedBytes));
    }

    async function attemptDecryption() {
      let passcode = document.getElementById('passcodeInput').value;
      if (!passcode) passcode = "WILMAP_DEFAULT_OPEN_ACCESS_PASS";

      try {
        const innerPayload = await decryptContainerPayload(passcode, containerPayloadData);
        
        if (innerPayload.format !== "WILMAP_CONTAINER_V3") {
          throw new Error("Container schema version mismatch.");
        }

        const currentEpoch = Math.floor(Date.now() / 1000);
        if (currentEpoch > innerPayload.expiry_epoch) {
          showModal('🔒', 'Expired Container', `Access expired on ${innerPayload.expiry_readable}.`, false);
          return;
        }

        mapBbox = innerPayload.bbox;
        cachedExpiryReadable = innerPayload.expiry_readable;
        const binaryString = atob(innerPayload.image_bytes);
        const bytes = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);

        const blob = new Blob([bytes], { type: 'image/jpeg' });
        if (baseImageBitmap) baseImageBitmap.close(); // Prevent memory leaks
        baseImageBitmap = await createImageBitmap(blob);
        
        document.getElementById('statusModal').classList.add('hidden');
        
        // Display Expiry Notice Modal on main canvas before unlocking
        document.getElementById('expiryNoticeBody').innerHTML = `This wilmap container has been successfully unlocked.<br><br><strong>Expiry Date:</strong> <span style="color: #ef4444; font-weight: bold;">${cachedExpiryReadable}</span><br><br>Please click OK to proceed.`;
        document.getElementById('expiryNoticeModal').classList.remove('hidden');

      } catch (err) {
        document.getElementById('statusBody').innerText = `❌ ${err.message || "Incorrect Passcode or Tampering Detected!"}`;
        document.getElementById('passcodeInput').value = '';
        document.getElementById('passcodeInput').focus();
      }
    }

    function dismissExpiryNotice() {
      document.getElementById('expiryNoticeModal').classList.add('hidden');
      canvas.classList.remove('hidden');
      document.getElementById('toolBar').classList.remove('hidden');
      
      resizeCanvas();
      resetView();
    }

    function resetView() {
      if (!baseImageBitmap) return;
      const displayW = canvas.parentElement.clientWidth;
      const displayH = canvas.parentElement.clientHeight;
      scale = Math.min(displayW / baseImageBitmap.width, displayH / baseImageBitmap.height);
      panX = (displayW - baseImageBitmap.width * scale) / 2;
      panY = (displayH - baseImageBitmap.height * scale) / 2;
      renderMapAndGps();
    }

    function setMode(mode) {
      activeMode = mode;
      document.querySelectorAll('#toolBar .btn').forEach(b => { if (b.id.startsWith('btn') && b.id !== 'btnTrack') b.className = 'btn'; });
      if (mode !== 'track') document.getElementById(mode === 'pan' ? 'btnPan' : 'btnPin').className = 'btn btn-active';
      
      const crosshair = document.getElementById('pinCrosshair');
      const pinActionBar = document.getElementById('pinActionBar');
      if (mode === 'pin') { crosshair.classList.remove('hidden'); pinActionBar.classList.remove('hidden'); }
      else { crosshair.classList.add('hidden'); pinActionBar.classList.add('hidden'); }
      renderMapAndGps();
    }

    function toggleTracking() {
      isTracking = !isTracking;
      const btn = document.getElementById('btnTrack');
      if (isTracking) { btn.style.backgroundColor = '#dc2626'; btn.innerText = '🛰️ Stop Track'; }
      else { btn.style.backgroundColor = '#2563eb'; btn.innerText = '🛰️ Start Track'; }
    }

    function captureCenterPin() {
      const rect = canvas.getBoundingClientRect();
      pendingPinCoords = screenToImageCoords(rect.left + rect.width / 2, rect.top + rect.height / 2);
      document.getElementById('pinModal').classList.remove('hidden');
    }
    function closePinModal() { document.getElementById('pinModal').classList.add('hidden'); }
    function confirmPin() {
      const remark = document.getElementById('pinRemarkInput').value.trim() || 'Pin';
      if (pendingPinCoords) {
        const geo = imageToGeoCoords(pendingPinCoords.x, pendingPinCoords.y);
        pins.push({ x: pendingPinCoords.x, y: pendingPinCoords.y, lon: geo.lon, lat: geo.lat, remark });
      }
      document.getElementById('pinRemarkInput').value = '';
      closePinModal(); 
      renderMapAndGps();
    }

    function clearGraphics() { pins = []; trackLogs = []; renderMapAndGps(); }
    function openExportModal() { document.getElementById('exportModal').classList.remove('hidden'); }
    function closeExportModal() { document.getElementById('exportModal').classList.add('hidden'); }

    function executeExport() {
      const format = document.querySelector('input[name="exportFormat"]:checked').value;
      let content = "";
      let mimeType = "application/json";
      let ext = format;

      if (format === 'geojson') {
        content = JSON.stringify({ 
          type: "FeatureCollection", 
          features: pins.map(p => ({ 
            type: "Feature", 
            geometry: { type: "Point", coordinates: [p.lon, p.lat] }, 
            properties: { remark: p.remark } 
          })) 
        }, null, 2);
        mimeType = "application/json";
      } else if (format === 'kml') {
        content = `<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2">\n  <Document>\n` +
          pins.map(p => `    <Placemark>\n      <name>${escapeXml(p.remark)}</name>\n      <Point><coordinates>${p.lon},${p.lat},0</coordinates></Point>\n    </Placemark>`).join('\n') +
          `\n  </Document>\n</kml>`;
        mimeType = "application/vnd.google-earth.kml+xml";
      } else if (format === 'csv') {
        content = "Longitude,Latitude,Remark\n" + pins.map(p => `"${p.lon}","${p.lat}","${p.remark.replace(/"/g, '""')}"`).join("\n");
        mimeType = "text/csv";
      }

      const blob = new Blob([content], { type: mimeType });
      const a = document.createElement('a'); 
      a.href = URL.createObjectURL(blob); 
      a.download = `wilmap_export_pins.${ext}`; 
      a.click();
      closeExportModal();
    }

    function escapeXml(str) {
      return str.replace(/[<>&'"]/g, function (c) {
        switch (c) {
          case '<': return '&lt;'; case '>': return '&gt;'; case '&': return '&amp;';
          case '\'': return '&apos;'; case '"': return '&quot;';
        }
      });
    }

    function screenToImageCoords(sx, sy) {
      const rect = canvas.getBoundingClientRect();
      return { x: (sx - rect.left - panX) / scale, y: (sy - rect.top - panY) / scale };
    }
    function imageToGeoCoords(ix, iy) {
      const [minX, minY, maxX, maxY] = mapBbox;
      return { lon: minX + (ix / baseImageBitmap.width) * (maxX - minX), lat: maxY - (iy / baseImageBitmap.height) * (maxY - minY) };
    }

    canvas.addEventListener('mousedown', (e) => {
      isDragging = true; dragStart = { x: e.clientX - panX, y: e.clientY - panY };
    });
    canvas.addEventListener('mousemove', (e) => {
      if (isDragging) { panX = e.clientX - dragStart.x; panY = e.clientY - dragStart.y; renderMapAndGps(); }
    });
    window.addEventListener('mouseup', () => { isDragging = false; });

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;
      const newScale = Math.max(0.05, Math.min(scale * zoomFactor, 50));

      panX = mouseX - (mouseX - panX) * (newScale / scale);
      panY = mouseY - (mouseY - panY) * (newScale / scale);
      scale = newScale;

      renderMapAndGps();
    }, { passive: false });

    function renderMapAndGps() {
      if (!baseImageBitmap || !canvas) return;
      const displayW = canvas.parentElement.clientWidth;
      const displayH = canvas.parentElement.clientHeight;
      
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, displayW, displayH);
      ctx.save();
      ctx.translate(panX, panY);
      ctx.scale(scale, scale);
      ctx.drawImage(baseImageBitmap, 0, 0);

      pins.forEach(p => {
        ctx.beginPath(); 
        ctx.arc(p.x, p.y, 7 / scale, 0, 2 * Math.PI);
        ctx.fillStyle = '#ef4444'; 
        ctx.fill();
        ctx.lineWidth = 2 / scale;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        ctx.font = `${Math.max(10, 12 / scale)}px sans-serif`;
        ctx.fillStyle = '#f8fafc';
        ctx.shadowColor = '#000000';
        ctx.shadowBlur = 4;
        ctx.fillText(p.remark, p.x + (10 / scale), p.y + (4 / scale));
        ctx.shadowBlur = 0;
      });
      ctx.restore();

      ctx.save();
      ctx.fillStyle = 'rgba(239, 68, 68, 0.25)';
      ctx.font = 'bold 14px monospace';
      ctx.textAlign = 'center';
      ctx.fillText("CONFIDENTIAL FIELD DATA - COPYING PROHIBITED", displayW / 2, 30);
      ctx.restore();
    }

    function showModal(icon, title, body, showPass) {
      canvas.classList.add('hidden');
      document.getElementById('statusModal').classList.remove('hidden');
      document.getElementById('statusIcon').innerText = icon;
      document.getElementById('statusTitle').innerText = title;
      document.getElementById('statusBody').innerText = body;
      const pContainer = document.getElementById('passcodeContainer');
      if (showPass) pContainer.classList.remove('hidden'); else pContainer.classList.add('hidden');
    }
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('ServiceWorker registration successful with scope: ', reg.scope))
          .catch((err) => console.log('ServiceWorker registration failed: ', err));
      });
    }
  </script>
